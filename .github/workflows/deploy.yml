# Nama workflow
name: Deploy AgroLink API to VPS

# Pemicu: Jalankan workflow ini setiap kali ada 'push' ke branch 'main'.
on:
  push:
    branches: ["main"]

# Daftar pekerjaan (jobs) yang akan dilakukan.
jobs:
  # Job 1: Membangun dan mengunggah image.
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: whsasmita/agrolink-api:latest

  # Job 2: Mendeploy ke VPS.
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Pindah ke direktori utama proyek di VPS
            cd /root/goagrolink-project

            # 2. Ambil perubahan terbaru konfigurasi dari Git (opsional)
            echo "Pulling latest changes from Git..."
            git pull origin main || true

            # 3. Pull image terbaru dari Docker Hub
            echo "Pulling latest image from Docker Hub..."
            docker compose pull go-backend

            # 4. Restart layanan backend Go secara aman tanpa mematikan database
            echo "Restarting go-backend service..."
            docker compose up -d --no-deps --build go-backend

            # 5. Bersihkan image lama yang tidak terpakai
            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete!"
